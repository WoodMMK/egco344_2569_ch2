<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header {
            background-color: #4CAF50;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        .container {
            padding: 1rem;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 1rem;
            margin: 1rem 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .card h3 {
            margin: 0 0 1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }
        table th, table td {
            border: 1px solid #ddd;
            padding: 0.5rem;
            text-align: left;
        }
        table th {
            background-color: #f4f4f4;
        }
    </style>
</head>
<body>
    <header>
        <h1>Electricity Dashboard</h1>
    </header>
    <div class="container">
        <div class="grid">
            <div class="card">
                <h3>Total Electricity Usage</h3>
                <p id="total-usage">Loading...</p>
            </div>
            <div class="card">
                <h3>Total Users</h3>
                <p id="total-users">Loading...</p>
            </div>
        </div>
        <div class="card">
            <h3>Electricity Usage by Province</h3>
            <table>
                <thead>
                    <tr>
                        <th>Province</th>
                        <th>Residential (kWh)</th>
                        <th>Small Business (kWh)</th>
                        <th>Medium Business (kWh)</th>
                        <th>Large Business (kWh)</th>
                    </tr>
                </thead>
                <tbody id="usage-table">
                    <tr>
                        <td colspan="5">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <script>
        async function fetchData() {
            const usageResponse = await fetch('./electricity_usages_en.json');
            const userResponse = await fetch('./electricity_users_en.json');
            const usageData = await usageResponse.json();
            const userData = await userResponse.json();

            // Calculate total electricity usage
            const totalUsage = usageData.Sheet1.reduce((sum, record) => sum + record.residential_kwh, 0);
            document.getElementById('total-usage').textContent = `${totalUsage.toLocaleString()} kWh`;

            // Calculate total users
            const totalUsers = userData.reduce((sum, record) => sum + record.residential_count, 0);
            document.getElementById('total-users').textContent = `${totalUsers.toLocaleString()} users`;

            // Populate usage table
            const usageTable = document.getElementById('usage-table');
            usageTable.innerHTML = '';
            usageData.Sheet1.forEach(record => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${record.province_name}</td>
                    <td>${record.residential_kwh.toLocaleString()}</td>
                    <td>${record.small_business_kwh.toLocaleString()}</td>
                    <td>${record.medium_business_kwh.toLocaleString()}</td>
                    <td>${record.large_business_kwh.toLocaleString()}</td>
                `;
                usageTable.appendChild(row);
            });
        }

        fetchData();
    </script>
</body>
</html>
